# The check bot. On every pull request it builds the site and the demo, and runs the link check (npm test).
# A red X means the change breaks the build, the demo or a link: fix it before merging.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build and check links
        run: npm test
