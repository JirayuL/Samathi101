# Builds the site and publishes it to GitHub Pages on every push to main.
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

# For now the bot runs only when started by hand (Actions tab -> Run workflow),
# because the client reviews the demo before anything goes live.
# After approval, remove the two # below so every push to main deploys automatically.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
